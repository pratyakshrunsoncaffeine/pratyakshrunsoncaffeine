.nd{animation:fade .4s both}
.root{animation:up .6s 2.2s cubic-bezier(.2,.7,.2,1) both}
.vd{animation:up .5s 2.8s both}.vd2{animation:fade .5s 3.2s both}
@keyframes fade{from{opacity:0}}
.pulse{animation:pulse 2.4s 3s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
