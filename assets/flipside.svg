<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-label="Flipside: prove what your coding agent did, without handing over the session"><title>Flipside: prove what your coding agent did, without handing over the session</title><style>
.in{animation:up .7s cubic-bezier(.2,.7,.2,1) both}
@keyframes up{from{opacity:0;transform:translateY(10px)}}
